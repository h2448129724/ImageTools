[build-system]
requires = [\"setuptools>=68.0\"]
build-backend = \"setuptools.build_meta\"

[project]
name = \"cabf-shared\"
version = \"1.2.0\"
description = \"CAB-F master annotation schema, validation, and export shared layer\"
requires-python = \">=3.10\"
dependencies = [
    \"opencv-python>=4.8.0\",
    \"numpy>=1.24.0\",
]

[tool.setuptools.packages.find]
where = [\".\"]
include = [\"cabf*\"]
