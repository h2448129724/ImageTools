[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cabf-tools"
version = "3.0.0"
description = "CAB-F工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "HuYu"}]

dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1",
]

[project.scripts]
cabf-flow = "project_modules.cabf_pipeline.flow:main"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "utils*", "project_modules*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
