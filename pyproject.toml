[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-tools"
version = "1.1.0"
description = "面向深度学习的图像处理和数据集准备工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "HuYu"}]

dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
image-tools = "cli:main"

[tool.setuptools.packages.find]
include = ["core*", "gui*", "utils*"]

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
